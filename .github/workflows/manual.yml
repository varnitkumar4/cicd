
name: Model Training CICD

permissions:
  id-token: write
  contents: write
  issues: write
  pull-requests: write

on:
  push:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2-dev \
            libjpeg-dev \
            libpango1.0-dev \
            libgif-dev \
            librsvg2-dev

      - name: Setup CML
        uses: iterative/setup-cml@v2

      - name: Train model
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install -r requirements.txt

          python train_model.py

          echo "# RF and LR Model Scores" > report.md
          cat scores.txt >> report.md

          cml comment create --publish=false report.md

      - name: Upload model outputs
        uses: actions/upload-artifact@v4
        with:
          name: model-training-outputs
          path: |
            scores.txt
            ConfusionMatrix.png
            FeatureImportance.png
          if-no-files-found: error
